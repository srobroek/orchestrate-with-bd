# Worktrunk hooks for this project.
# Lifecycle reference: https://worktrunk.dev/hook/
#
# Beads hooks cannot be used here. `core.hooksPath` is owned by git-defender
# (/usr/local/amazon/var/git-defender/hooks), and `bd hooks install` would repoint it,
# disabling a security control. That is also why every `bd init` in this repository passes
# --skip-hooks. Worktrunk runs its own hooks from this file instead, touching no git config.
#
# Scope, stated because it limits what may depend on a hook here: a hook fires only for work done
# through `wt`. A plain `git commit` bypasses it, so a hook is a convenience that usually runs,
# never an invariant. Anything that must hold belongs in a gate.
#
# There are deliberately no `bd dolt` hooks. `git push` does not carry `refs/dolt/data`, so the
# ledger needs an explicit `bd dolt push`; it runs once at run close, from the canonical checkout,
# with its exit status checked. A `post-commit` push would fire on every commit and, on a
# fast-forward that creates no commit, not at all, and the previous bodies ended in `|| true`,
# swallowing exactly the failure the push exists to surface. An export-and-commit fallback is not a
# substitute either: `bd export --all` writes stdout only, and committing from `post-commit`
# recurses.
