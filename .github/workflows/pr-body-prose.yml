name: pr-body-prose

# Gates human PR bodies. Renovate and release-please bodies are generated;
# rewriting release-please markers can break release parsing (measured on #22).
# Exempt only authenticated PR authors, never titles, labels, or the run actor.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  contents: read

jobs:
  prose:
    # GitHub REST author IDs: renovate[bot] (#13), sjorsr-release-bot[bot] (#22).
    if: >-
      ${{ !(github.event.pull_request.user.type == 'Bot'
        && (github.event.pull_request.user.id == 29139614
          || github.event.pull_request.user.id == 301724168)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # The digest is the one published in vale_3.17.1_checksums.txt for this asset;
      # bump both together.
      - name: Install Vale
        env:
          GH_TOKEN: ${{ github.token }}
          VALE_SHA256: db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd
        run: |
          gh release download v3.17.1 --repo errata-ai/vale --pattern 'vale_3.17.1_Linux_64-bit.tar.gz' --dir "$RUNNER_TEMP/vale"
          echo "$VALE_SHA256  $RUNNER_TEMP/vale/vale_3.17.1_Linux_64-bit.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/vale/vale_3.17.1_Linux_64-bit.tar.gz" -C "$RUNNER_TEMP/vale"
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"

      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh pr view "${{ github.event.pull_request.number }}" --json body -q .body > pr-body.md

      # Errors-only, the same policy as ci.yml's README gate; the score lands in the
      # step summary and never fails the job.
      - name: Gate PR body
        run: uvx --from slopvac==1.0.1 python scripts/check-prose-report.py --gate pr-body.md
