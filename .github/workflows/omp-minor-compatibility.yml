name: Review OMP minor compatibility

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One detector at a time per repository: a scheduled run and a manual run that
# overlap would each read the issue list before the other creates the issue, so
# they are serialized rather than cancelled.
concurrency:
  group: ${{ github.repository }}-omp-minor-detector
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    # Matches ci.yml. This job is a checkout plus two gh calls against the npm registry and
    # the issues API, so the bound exists for a hung request, not for slow work. It runs on a
    # schedule, where nobody is watching it stall.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Open compatibility issue when a new OMP minor is available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(jq -r '.devDependencies["@oh-my-pi/pi-coding-agent"]' package.json)
          current_major=${current%%.*}
          current_minor=${current#*.}
          current_minor=${current_minor%%.*}
          latest=$(npm view @oh-my-pi/pi-coding-agent version)
          latest_major=${latest%%.*}
          latest_minor=${latest#*.}
          latest_minor=${latest_minor%%.*}
          if [[ "$latest_major" != "$current_major" || "$latest_minor" -le "$current_minor" ]]; then
            exit 0
          fi
          title="Review OMP ${latest_major}.${latest_minor} compatibility"
          # Read every issue in the repository across every state. --paginate walks
          # the whole collection and --slurp gathers the pages into one array, so no
          # page bound can hide an existing issue and turn this job into a duplicate
          # factory.
          if ! pages=$(gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "repos/${GH_REPO}/issues?state=all&per_page=100"); then
            echo "Unable to read existing issues; refusing to create a duplicate" >&2
            exit 1
          fi
          # Flatten the pages, drop pull requests (the issues API returns both, and
          # only a real issue can be this job's duplicate), then match the title
          # exactly. Any shape jq cannot process is a failure, never a green light.
          if ! duplicates=$(jq --arg title "$title" '
                if type == "array" then . else error("expected an array of pages, got \(type)") end
                | map(if type == "array" then . else error("expected each page to be an array, got \(type)") end)
                | add // []
                | map(select(has("pull_request") | not))
                | map(select(.title == $title))
                | length
              ' <<<"$pages"); then
            echo "Unable to parse existing issues; refusing to create a duplicate" >&2
            exit 1
          fi
          if [[ ! "$duplicates" =~ ^[0-9]+$ ]]; then
            echo "Unexpected issue count '${duplicates}'; refusing to create a duplicate" >&2
            exit 1
          fi
          if [[ "$duplicates" -gt 0 ]]; then
            exit 0
          fi
          gh issue create --repo "$GH_REPO" --title "$title" --body "The official npm metadata reports @oh-my-pi/pi-coding-agent ${latest}. Review compatibility before updating the pinned OMP development baseline from ${current}."
