name: Release Please

# TOKEN: the release pull request is authored with a GitHub App token
# (RELEASE_APP_CLIENT_ID + RELEASE_APP_PRIVATE_KEY), never the default GITHUB_TOKEN,
# and there is deliberately no fallback. GitHub does not trigger workflows from
# GITHUB_TOKEN commits, so release-please would never get the post-merge run it needs
# to cut the tag; every later push then reports "There are untagged, merged release
# PRs outstanding - aborting" and the version silently never ships. Failing loudly on
# a missing secret is better than shipping nothing. Mirrors
# agentic-packages/.github/workflows/release-please.yml.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (for example, v0.5.1)
        required: true
        type: string

jobs:
  release-please:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint release-app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # App token so the release PR's commits trigger the required PR checks.
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Validate release identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expectedName = '@srobroek/orchestrate-with-bd';
          const expectedTag = `v${pkg.version}`;
          if (pkg.name !== expectedName) {
            throw new Error(`Unexpected package name: ${pkg.name}`);
          }
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${pkg.version}`);
          }
          NODE

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --access public
