name: ci

on:
  push:
    branches: [main]
  pull_request:

# The default token is read-only everywhere in this workflow: every step is satisfied
# by `contents: read` (fetching the PR base, downloading a public release, installing
# packages). A job that needs more declares it on the job.
permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
        if: github.event_name == 'pull_request'

      - name: Install agnix
        if: github.event_name == 'pull_request'
        env:
          BINSTALL_DISABLE_TELEMETRY: "true"
        run: cargo binstall agnix-cli@0.52.2 --no-confirm

      - name: Agnix staged-hook behavior
        if: github.event_name == 'pull_request'
        run: python3 scripts/test-agnix-hook.py

      - name: Agentic staged check
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          index_file="$(mktemp)"
          trap 'rm -f "$index_file"' EXIT
          cp "$(git rev-parse --git-path index)" "$index_file"
          export GIT_INDEX_FILE="$index_file"
          git read-tree HEAD
          export AGNIX_DIFF_BASE="$BASE_SHA"
          python3 scripts/check-agnix-staged.py

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      # OMP loads `omp.extensions` entries directly and accepts `.ts`, so this plugin
      # ships source and has no bundle to keep fresh. The check that remains is whether
      # the entry still bundles at all, which catches an unresolvable import that
      # type-checking alone would miss. The output is discarded.
      - name: Entry point bundles
        run: bun build --target=bun src/index.ts --outdir /tmp/bundlecheck --external '@oh-my-pi/*' >/dev/null

  py:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # uvx is not preinstalled on GitHub runners.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # The digest is the one published in vale_3.17.1_checksums.txt for this asset;
      # bump both together.
      - name: Install Vale
        env:
          GH_TOKEN: ${{ github.token }}
          VALE_SHA256: db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd
        run: |
          gh release download v3.17.1 --repo errata-ai/vale --pattern 'vale_3.17.1_Linux_64-bit.tar.gz' --dir "$RUNNER_TEMP/vale"
          echo "$VALE_SHA256  $RUNNER_TEMP/vale/vale_3.17.1_Linux_64-bit.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/vale/vale_3.17.1_Linux_64-bit.tar.gz" -C "$RUNNER_TEMP/vale"
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"

      # The py job is the prose gate alone: slopvac is a Python package, so its regression
      # suite and the gate run under `uvx`. Every runtime script is TypeScript under bun.
      - name: Prose checker regression
        run: uvx --from slopvac==1.0.1 python scripts/_test_prose_gate.py

      # Errors-only, the same policy as pr-body-prose.yml; the score lands in the step
      # summary and never fails the job.
      - name: Prose gate
        run: uvx --from slopvac==1.0.1 python scripts/check-prose-report.py --gate README.md skills/orchestrate-with-bd/SKILL.md
